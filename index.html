
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>情感探索问卷</title>
<style>

  :root {
    --pink: #e85d75;
    --pink-light: #fce4ec;
    --blue: #5c7cfa;
    --blue-light: #e8eaf6;
    --green: #38b2ac;
    --green-light: #e6fffa;
    --amber: #f59e0b;
    --amber-light: #fffbeb;
    --gray: #9ca3af;
    --bg: #faf9f7;
    --card: #ffffff;
    --text: #1f2937;
    --text-secondary: #6b7280;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ===== 页面容器 ===== */
  .page {
    display: none;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px 20px;
    animation: fadeIn .35s ease;
  }
  .page.active { display: flex; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes needle { from { transform: rotate(-90deg); } to { transform: rotate(var(--needle-angle)); } }

  /* ===== 首页 ===== */
  .cover {
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 20px;
  }
  .cover-icon {
    width: 72px; height: 72px;
    background: var(--pink-light);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
  }
  .cover h1 { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  .cover .subtitle { color: var(--text-secondary); font-size: 15px; line-height: 1.6; max-width: 300px; }
  .cover .meta { display: flex; gap: 16px; font-size: 13px; color: var(--text-secondary); }
  .cover .meta span { background: #f3f4f6; padding: 4px 12px; border-radius: 20px; }

  /* ===== 按钮 ===== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 16px 40px;
    border: none; border-radius: 50px;
    font-size: 17px; font-weight: 600;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(.96); }
  .btn-primary {
    background: var(--pink); color: #fff;
    box-shadow: 0 4px 16px rgba(232,93,117,.35);
  }
  .btn-outline {
    background: transparent; color: var(--pink);
    border: 2px solid var(--pink);
  }
  .btn-sm { padding: 12px 28px; font-size: 15px; }

  /* ===== 答题页 ===== */
  .quiz { justify-content: center; gap: 24px; }
  .progress-bar {
    width: 100%; height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%; background: var(--pink); border-radius: 3px;
    transition: width .4s ease;
  }
  .progress-text { font-size: 13px; color: var(--text-secondary); text-align: center; }
  .question-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px 22px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    animation: pop .3s ease;
  }
  .question-card .q-num { font-size: 13px; color: var(--pink); font-weight: 600; margin-bottom: 8px; }
  .question-card .q-text { font-size: 17px; line-height: 1.65; font-weight: 500; }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    padding: 16px 18px;
    background: var(--card);
    border: 2px solid #e5e7eb;
    border-radius: 14px;
    font-size: 15px;
    cursor: pointer;
    transition: all .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .option.selected {
    border-color: var(--pink);
    background: var(--pink-light);
    color: var(--pink);
    font-weight: 600;
  }

  /* ===== 结果页 ===== */
  .result { gap: 20px; padding-bottom: 40px; }
  .result-header { text-align: center; }
  .result-header h2 { font-size: 22px; margin-bottom: 4px; }
  .result-header .desc { font-size: 14px; color: var(--text-secondary); }

  /* 仪表盘 */
  .gauge-wrap {
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 0;
  }
  .gauge-svg { width: 220px; height: 130px; }
  .gauge-label {
    margin-top: 8px; font-size: 20px; font-weight: 700;
  }
  .gauge-stars { font-size: 18px; color: var(--amber); margin-top: 4px; }
  .gauge-score { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  /* 雷达图 */
  .radar-section {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  .radar-section h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; text-align: center; }
  .radar-svg { display: block; margin: 0 auto; width: 200px; height: 200px; }

  /* 刻度带 */
  .dimension-list { display: flex; flex-direction: column; gap: 16px; }
  .dim-item { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  .dim-item .dim-name { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .scale-track {
    display: flex; border-radius: 8px; overflow: hidden; height: 28px; position: relative;
  }
  .scale-seg {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600; color: #fff;
  }
  .scale-seg.s1 { background: #9ca3af; }
  .scale-seg.s2 { background: #93c5fd; }
  .scale-seg.s3 { background: #fcd34d; }
  .scale-seg.s4 { background: #fb923c; }
  .scale-seg.s5 { background: #f472b6; }
  .scale-seg.active { box-shadow: inset 0 0 0 3px #fff; }
  .scale-marker {
    position: absolute; top: -4px; width: 4px; height: 36px;
    background: #1f2937; border-radius: 2px;
    transform: translateX(-50%);
    transition: left .5s ease;
  }
  .dim-desc { font-size: 13px; color: var(--text-secondary); margin-top: 8px; line-height: 1.55; }
  .dim-score-tag { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }

  /* 结果操作 */
  .result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; padding-top: 8px; }

  /* 分享提示条 */
  .share-hint {
    background: var(--pink-light);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 13px;
    color: var(--pink);
    text-align: center;
    line-height: 1.6;
  }
  .share-hint strong { font-weight: 700; }

  /* ===== 导出长图（隐藏） ===== */
  #shareCanvas { display: none; }

  /* ===== 提示弹窗 ===== */
  .toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(.9);
    background: rgba(0,0,0,.75); color: #fff; padding: 14px 28px;
    border-radius: 12px; font-size: 14px; z-index: 999;
    opacity: 0; pointer-events: none; transition: all .25s;
  }
  .toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }

  /* ===== 与电脑端对齐的程度化结果样式 ===== */
  .gauge-svg, .degree-gauge { width: 220px; height: 138px; display: block; margin: 0 auto; }
  .radar-svg { display:block; margin: 0 auto; width: 250px; height: 208px; }
  .type-card {
    background: var(--card); border-radius: var(--radius); padding: 22px 18px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06); text-align: center;
  }
  .type-card .type-emoji { font-size: 44px; line-height: 1; }
  .type-card h3 { font-size: 21px; font-weight: 700; margin: 10px 0 6px; }
  .type-card .type-summary { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
  .panel {
    background: var(--card); border-radius: var(--radius); padding: 18px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  .panel h4 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .panel .panel-body { font-size: 14px; color: #4b5563; line-height: 1.75; }
  .gauge-label { font-size: 19px; }
  .dim-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .dim-header .dim-name { font-size: 14px; font-weight: 600; }
  .dim-degree-tag {
    font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap;
  }
  .dim-score-lite { font-size: 11px; font-weight: 400; opacity: .75; margin-left: 4px; }
  .scale-band { display: flex; gap: 4px; height: 14px; }
  .scale-band .scale-seg { border-radius: 4px; }
  .scale-scale-legend { display: flex; margin-top: 6px; }
  .scale-scale-legend span { flex: 1; text-align: center; font-size: 10px; color: #b9bcd6; }
  .tip-item { display: flex; gap: 10px; font-size: 14px; line-height: 1.7; color: #4b5563; margin-bottom: 10px; }
  .tip-item .tip-icon { flex: none; }

</style>
</head>
<body>

<!-- ========== 首页 ========== -->
<div class="page cover active" id="pageCover">
  <div class="cover-icon">💗</div>
  <h1>情感探索问卷</h1>
  <p class="subtitle">20 道题，重新认识你的情感世界。测测你在亲密关系中的依恋风格与情感投入程度。</p>
  <div class="meta">
    <span>📝 20 题</span>
    <span>⏱ 约 5 分钟</span>
    <span>🔒 匿名</span>
  </div>
  <button class="btn btn-primary" onclick="startQuiz()">开始测试</button>
</div>

<!-- ========== 答题页 ========== -->
<div class="page quiz" id="pageQuiz">
  <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText"></div>
  <div class="question-card" id="questionCard">
    <div class="q-num" id="qNum"></div>
    <div class="q-text" id="qText"></div>
  </div>
  <div class="options" id="optionsWrap"></div>
</div>

<!-- ========== 结果页 ========== -->
<div class="page result" id="pageResult">
  <div class="result-header">
    <h2>你的情感画像</h2>
    <p class="desc">基于 20 道题的综合分析</p>
  </div>

  <div class="type-card">
    <div class="type-emoji" id="resEmoji"></div>
    <h3 id="resTitle"></h3>
    <p class="type-summary" id="resSummary"></p>
  </div>

  <div class="gauge-wrap">
    <div id="gaugeBox"></div>
    <div class="gauge-label" id="gaugeLabel"></div>
    <div class="gauge-stars" id="gaugeStars"></div>
    <div class="gauge-score" id="gaugeScore"></div>
  </div>

  <div class="panel">
    <h4>📖 详细分析</h4>
    <div class="panel-body" id="resDesc"></div>
  </div>

  <div class="radar-section">
    <h3>📊 三维度程度图</h3>
    <div id="radarBox"></div>
    <div style="text-align:center;font-size:11px;color:#b9bcd6;margin-top:6px;">虚线圈由内到外为 25% / 50% / 75% / 100% 程度</div>
  </div>

  <div class="dimension-list" id="dimList"></div>

  <div class="panel">
    <h4>💡 专属建议</h4>
    <div id="tipList"></div>
  </div>

  <div class="panel">
    <h4>🌤️ 温馨提示</h4>
    <div class="panel-body">本问卷仅供自我探索与娱乐参考，不构成专业心理诊断。情感模式没有绝对的好坏，看见自己就是改变的开始。</div>
  </div>

  <div class="share-hint">
    💡 点击下方「生成分享图」，长按保存图片后可直接发小红书、朋友圈～
  </div>

  <div class="result-actions">
    <button class="btn btn-primary btn-sm" onclick="exportShare()">📸 生成分享图</button>
    <button class="btn btn-outline btn-sm" onclick="restart()">🔄 再测一次</button>
  </div>
</div>

<canvas id="shareCanvas" style="display:none;"></canvas>
<div class="toast" id="toast"></div>

<script>
const questions = [
            // 依恋风格 (1-7)
            {

            {

// ===== 程度（等级）体系：把分数翻译成人能感受到的程度 =====
        const DEGREE_SCALES = [
            { name: '偏低', min: 0.00, color: '#a0aec0' },
            { name: '中低', min: 0.20, color: '#5bb6e8' },
            { name: '中等', min: 0.40, color: '#667eea' },
            { name: '中高', min: 0.60, color: '#9b6cf3' },
            { name: '较高', min: 0.80, color: '#f0689b' }
        ];

        function degreeOf(pct) {
            let cur = DEGREE_SCALES[0];
            DEGREE_SCALES.forEach(s => { if (pct >= s.min) cur = s; });
            return cur;
        }

        function degreeStars(pct) {
            const n = Math.max(1, Math.min(5, Math.ceil(pct * 5)));
            return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n);
        }

        // 综合程度仪表盘（半圆 + 指针）
        function gaugeSVG(pct, color) {
            const C = Math.PI * 90;
            const p = Math.max(0.02, Math.min(1, pct));
            const rad = Math.PI * (1 - p);
            const px = (110 + 74 * Math.cos(rad)).toFixed(1);
            const py = (110 - 74 * Math.sin(rad)).toFixed(1);
            return `<svg class="degree-gauge" viewBox="0 0 220 138" xmlns="http://www.w3.org/2000/svg">
                <path d="M20,110 A90,90 0 0 1 200,110" fill="none" stroke="#eceef8" stroke-width="17" stroke-linecap="round"/>
                <path d="M20,110 A90,90 0 0 1 200,110" fill="none" stroke="${color}" stroke-width="17" stroke-linecap="round"
                      stroke-dasharray="${(p * C).toFixed(1)} ${C.toFixed(1)}"/>
                <text x="14" y="134" font-size="11" fill="#b9bcd6" text-anchor="middle">内敛</text>
                <text x="206" y="134" font-size="11" fill="#b9bcd6" text-anchor="middle">外放</text>
                <line x1="110" y1="110" x2="${px}" y2="${py}" stroke="#4a4a68" stroke-width="3" stroke-linecap="round"/>
                <circle cx="110" cy="110" r="6.5" fill="#4a4a68"/>
            </svg>`;
        }

        // 三维度程度雷达图
        function radarSVG(dims) {
            const cx = 150, cy = 120, R = 78;
            const ang = [90, 210, 330].map(a => a * Math.PI / 180);
            const pt = (i, r) => [cx + r * Math.cos(ang[i]), cy - r * Math.sin(ang[i])];
            const rings = [0.25, 0.5, 0.75, 1].map(f => {
                const p = [0, 1, 2].map(i => pt(i, R * f).map(v => v.toFixed(1)).join(',')).join(' ');
                return `<polygon points="${p}" fill="none" stroke="#e3e5f2" stroke-width="1"/>`;
            }).join('');
            const axes = [0, 1, 2].map(i => {
                const [x, y] = pt(i, R);
                return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e3e5f2" stroke-width="1"/>`;
            }).join('');
            const poly = [0, 1, 2].map(i => pt(i, R * Math.max(0.06, dims[i].pct)).map(v => v.toFixed(1)).join(',')).join(' ');
            const dots = [0, 1, 2].map(i => {
                const [x, y] = pt(i, R * Math.max(0.06, dims[i].pct));
                return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#667eea"/>`;
            }).join('');
            const labels = [0, 1, 2].map(i => {
                const [x, y] = pt(i, R + 20);
                const anchor = i === 1 ? 'end' : (i === 2 ? 'start' : 'middle');
                const dy = i === 0 ? -2 : 8;
                return `<text x="${x.toFixed(1)}" y="${(y + dy).toFixed(1)}" font-size="11.5" font-weight="600" fill="#667eea" text-anchor="${anchor}">${dims[i].name}</text>` +
                       `<text x="${x.toFixed(1)}" y="${(y + dy + 14).toFixed(1)}" font-size="11" fill="${dims[i].color}" text-anchor="${anchor}">${dims[i].degree}</text>`;
            }).join('');
            return `<svg class="radar-svg" viewBox="0 0 300 250" xmlns="http://www.w3.org/2000/svg">
                ${rings}${axes}
                <polygon points="${poly}" fill="rgba(102,126,234,.20)" stroke="#667eea" stroke-width="2"/>
                ${dots}${labels}
            </svg>`;
        }

        // 五段程度刻度带
        function scaleBandHTML(pct, color) {
            const idx = DEGREE_SCALES.indexOf(degreeOf(pct));
            return '<div class="scale-band">' + DEGREE_SCALES.map((s, i) =>
                `<div class="scale-seg${i <= idx ? ' lit' : ''}" title="${s.name}" style="background:${i <= idx ? color : '#eceef8'}"></div>`
            ).join('') + '</div>' +
            '<div class="scale-scale-legend"><span>偏低</span><span>中低</span><span>中等</span><span>中高</span><span>较高</span></div>';
        }

        // 各维度分档解读
        function dimLevelText(dimName, score) {
            const level = score >= 15 ? 'high' : (score >= 8 ? 'mid' : 'low');
            const texts = {
                '依恋安全感': {
                    high: '你在亲密关系中感到安心，既享受亲密也尊重边界，稳定感是你的底色。',
                    mid: '你在依赖与独立之间偶尔摇摆，安全感时多时少，关系中稳定的回应能帮你巩固它。',
                    low: '亲密关系容易触发你的不安，你可能在"怕被冷落"和"怕被束缚"之间反复拉扯——先看见这份不安，就是改变的开始。'
                },
                '情绪表达力': {
                    high: '你能准确识别并表达情绪，别人很容易读懂你，你也常能通过沟通化解心结。',
                    mid: '你大多时候能表达自己，但遇到强烈情绪时可能词不达意或选择沉默，练习"说感受"而非"说事情"会更有帮助。',
                    low: '你习惯把情绪藏起来，不轻易示弱。情绪不会凭空消失，只会在别处冒出来，试着从写日记或向最信任的人倾诉开始。'
                },
                '冲突处理力': {
                    high: '你把冲突视为了解彼此的机会，对事不对人，吵完架关系反而更近——这是非常难得的成熟。',
                    mid: '你能处理大多数分歧，但情绪上头时偶尔会冷战或翻旧账，学会"暂停—复盘—再沟通"会让冲突更可控。',
                    low: '面对冲突你倾向回避或硬扛，问题容易积累成隔阂。记住：表达不满不会毁掉关系，憋着才会。'
                }
            };
            return texts[dimName][level];
        }

/* ===== 页面切换 ===== */
function showPage(id) {
  document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

/* ===== 答题 ===== */
function startQuiz() {
  currentQ = 0;
  answers = new Array(questions.length).fill(null);
  showPage('pageQuiz');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  const total = questions.length;
  document.getElementById('progressFill').style.width = (currentQ / total * 100) + '%';
  document.getElementById('progressText').textContent = '第 ' + (currentQ + 1) + ' / ' + total + ' 题';
  document.getElementById('qNum').textContent = '问题 ' + (currentQ + 1);
  document.getElementById('qText').textContent = q.text;

  const card = document.getElementById('questionCard');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'pop .3s ease';

  const wrap = document.getElementById('optionsWrap');
  wrap.innerHTML = '';
  q.options.forEach(function (opt, i) {
    const div = document.createElement('div');
    div.className = 'option' + (answers[currentQ] === i ? ' selected' : '');
    div.textContent = opt.text;
    div.onclick = function () { selectOption(i); };
    wrap.appendChild(div);
  });
}

function selectOption(idx) {
  answers[currentQ] = idx;
  document.querySelectorAll('.option').forEach(function (el, i) {
    el.classList.toggle('selected', i === idx);
  });
  clearTimeout(advanceTimer);
  advanceTimer = setTimeout(function () {
    if (currentQ < questions.length - 1) {
      currentQ++;
      renderQuestion();
    } else {
      document.getElementById('progressFill').style.width = '100%';
      setTimeout(showResult, 350);
    }
  }, 280);
}

/* ===== 计分（与电脑端完全一致：按选项分值累加，满分按题目最高分动态汇总） ===== */
function calcScores() {
  const catScore = { attachment: 0, expression: 0, conflict: 0 };
  questions.forEach(function (q, i) {
    const ai = answers[i];
    const s = (ai === null || ai === undefined) ? 0 : q.options[ai].score;
    catScore[q.category] += s;
  });

  const total = catScore.attachment + catScore.expression + catScore.conflict;
  const result = resultTypes.find(function (r) { return total >= r.min; });

  const maxOf = function (cat) {
    return questions.filter(function (q) { return q.category === cat; })
                    .reduce(function (s, q) { return s + Math.max.apply(null, q.options.map(function (o) { return o.score; })); }, 0);
  };

  const dims = [
    { name: '依恋安全感', score: catScore.attachment, max: maxOf('attachment') },
    { name: '情绪表达力', score: catScore.expression, max: maxOf('expression') },
    { name: '冲突处理力', score: catScore.conflict, max: maxOf('conflict') }
  ];
  dims.forEach(function (d) {
    d.pct = d.score / d.max;
    const s = degreeOf(d.pct);
    d.degree = s.name;
    d.color = s.color;
    d.stars = degreeStars(d.pct);
    d.comment = dimLevelText(d.name, d.score);
  });

  const overallPct = total / 100;
  const overall = degreeOf(overallPct);

  return {
    emoji: result.emoji, title: result.title, summary: result.summary, desc: result.desc,
    tips: result.suggestions,
    total: total,
    overallDegree: overall.name, overallColor: overall.color, overallPct: overallPct,
    overallStars: degreeStars(overallPct),
    dims: dims,
    date: new Date().toLocaleDateString('zh-CN')
  };
}

/* ===== 结果页渲染 ===== */

  const d = calcScores();

        // ===== 导出结果图（Canvas 绘制，无需外部库） =====
        function roundRectPath(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function wrapLines(ctx, text, maxWidth) {
            const lines = [];
            let line = '';
            for (const ch of text) {
                if (ch === '\n') { lines.push(line); line = ''; continue; }
                if (ctx.measureText(line + ch).width > maxWidth) { lines.push(line); line = ch; }
                else line += ch;
            }
            if (line) lines.push(line);
            return lines;
        }

        // 布局绘制：在 ctx 上绘制，返回内容底部 y 坐标
        // 画综合程度仪表盘（半圆 + 指针）
        function drawGaugeCanvas(ctx, cx, cy, R, pct, color) {
            const p = Math.max(0.02, Math.min(1, pct));
            ctx.lineCap = 'round';
            ctx.lineWidth = 16;
            ctx.strokeStyle = '#eceef8';
            ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI, Math.PI * 2); ctx.stroke();
            ctx.strokeStyle = color;
            ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI, Math.PI + Math.PI * p); ctx.stroke();
            const ang = Math.PI * (1 - p);
            ctx.strokeStyle = '#4a4a68';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + (R - 13) * Math.cos(ang), cy - (R - 13) * Math.sin(ang));
            ctx.stroke();
            ctx.fillStyle = '#4a4a68';
            ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#b9bcd6';
            ctx.font = '12px "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('内敛', cx - R, cy + 30);
            ctx.fillText('外放', cx + R, cy + 30);
            ctx.textAlign = 'left';
        }

        // 画三维度程度雷达图
        function drawRadarCanvas(ctx, cx, cy, R, dims) {
            const ang = [90, 210, 330].map(a => a * Math.PI / 180);
            const pt = (i, r) => [cx + r * Math.cos(ang[i]), cy - r * Math.sin(ang[i])];
            ctx.strokeStyle = '#e3e5f2';

                    k === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
                });
                ctx.closePath(); ctx.stroke();
            });

            });

        // 画五段程度刻度带

        // 布局绘制：在 ctx 上绘制，返回内容底部 y 坐标
        function drawResultCard(ctx, W, M, d) {
            const cx = M + 40;              // 卡片内容左边距
            const cw = W - M * 2 - 80;      // 内容宽度
            const deg = d.overallDegree || degreeOf(d.overallPct != null ? d.overallPct : d.total / 100).name;
            const degColor = d.overallColor || degreeOf(d.total / 100).color;
            const degPct = d.overallPct != null ? d.overallPct : d.total / 100;
            let y = M + 55;

            // 顶部小标题
            ctx.fillStyle = '#a5a8c9';
            ctx.font = '600 20px "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('💝 情感探索问卷 · 我的情感画像', W / 2, y);
            y += 78;

            // Emoji
            ctx.font = '72px sans-serif';
            ctx.fillText(d.emoji, W / 2, y);
            y += 62;

            // 类型标题
            ctx.fillStyle = '#2d2d44';
            ctx.font = 'bold 42px "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.fillText(d.title, W / 2, y);
            y += 46;

            // 一句话总结
            ctx.fillStyle = '#555';
            ctx.font = '600 22px "PingFang SC", "Microsoft YaHei", sans-serif';
            wrapLines(ctx, d.summary, cw).forEach(line => { ctx.fillText(line, W / 2, y); y += 34; });
            y += 26;

            // ===== 综合程度仪表盘 =====
            const gR = 76;
            drawGaugeCanvas(ctx, W / 2, y + gR, gR, degPct, degColor);
            y += gR * 2 + 16;

            ctx.fillStyle = degColor;
            ctx.font = 'bold 28px "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.fillText('情感投入程度：' + deg, W / 2, y);
            y += 32;
            ctx.font = 'bold 22px sans-serif';
            ctx.fillText(d.overallStars || degreeStars(degPct), W / 2, y);
            y += 28;
            ctx.fillStyle = '#a5a8c9';
            ctx.font = '14px "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.fillText(`程度由 20 题作答综合评定 · 量化得分 ${d.total} / 100`, W / 2, y);
            y += 56;

            // 分割线
            ctx.strokeStyle = '#eceef8';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(cx, y); ctx.lineTo(cx + cw, y); ctx.stroke();
            y += 48;

            // 详细分析
            ctx.textAlign = 'left';
            ctx.fillStyle = '#333';
            ctx.font = 'bold 26px "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.fillText('📖 详细分析', cx, y);
            y += 40;
            ctx.fillStyle = '#666';
            ctx.font = '18px "PingFang SC", "Microsoft YaHei", sans-serif';
            wrapLines(ctx, d.desc, cw).forEach(line => { ctx.fillText(line, cx, y); y += 31; });
            y += 40;

            // ===== 维度程度雷达图 =====
            ctx.fillStyle = '#333';
            ctx.font = 'bold 26px "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.fillText('📊 维度程度图', cx, y);
            y += 122;
            drawRadarCanvas(ctx, W / 2, y, 90, d.dims);
            y += 126;
            ctx.fillStyle = '#9b9ec4';
            ctx.font = '13px "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('三维度程度总览（虚线圈由内到外为 25% / 50% / 75% / 100% 程度）', W / 2, y);
            ctx.textAlign = 'left';
            y += 44;

            // 维度程度明细
            d.dims.forEach(dim => {
                const dc = dim.color || degreeOf(dim.pct).color;
                const dn = dim.degree || degreeOf(dim.pct).name;
                ctx.fillStyle = '#444';
                ctx.font = '600 19px "PingFang SC", "Microsoft YaHei", sans-serif';
                ctx.fillText(dim.name, cx, y);
                ctx.textAlign = 'right';
                ctx.fillStyle = dc;
                ctx.font = 'bold 19px "PingFang SC", "Microsoft YaHei", sans-serif';
                ctx.fillText(`${dn} ${(dim.stars || degreeStars(dim.pct))}  ${dim.score}/${dim.max != null ? dim.max : 21} 分`, cx + cw, y);
                ctx.textAlign = 'left';
                y += 22;
                drawScaleBand(ctx, cx, y, cw, 14, dim.pct, dc);
                ctx.fillStyle = '#b9bcd6';
                ctx.font = '11px "PingFang SC", "Microsoft YaHei", sans-serif';
                const legW = (cw - 12) / 5;
                ['偏低', '中低', '中等', '中高', '较高'].forEach((t, k) => {
                    ctx.textAlign = k === 0 ? 'left' : (k === 4 ? 'right' : 'center');
                    const lx = k === 0 ? cx : (k === 4 ? cx + cw : cx + legW * (k + 0.5));
                    ctx.fillText(t, lx, y + 27);
                });
                ctx.textAlign = 'left';
                y += 48;
                ctx.fillStyle = '#999';
                ctx.font = '15px "PingFang SC", "Microsoft YaHei", sans-serif';
                wrapLines(ctx, dim.comment, cw).forEach(line => { ctx.fillText(line, cx, y); y += 24; });
                y += 18;
            });
            y += 16;

            // 建议
            ctx.fillStyle = '#333';
            ctx.font = 'bold 26px "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.fillText('💡 专属建议', cx, y);
            y += 40;
            ctx.font = '18px "PingFang SC", "Microsoft YaHei", sans-serif';
            d.tips.forEach((tip, i) => {
                ctx.fillText(['🌱', '🗣️', '🤝', '💗'][i % 4], cx, y);
                wrapLines(ctx, tip, cw - 36).forEach(line => {
                    ctx.fillStyle = '#555';
                    ctx.fillText(line, cx + 36, y);
                    y += 29;
                });
                y += 10;
            });
            y += 14;

            // 温馨提示框
            const tipTitle = '🌤️ 温馨提示';
            const tipBody = '本问卷仅供自我探索与娱乐参考，不构成专业心理诊断。情感模式没有绝对的好坏，看见自己就是改变的开始。';
            ctx.font = '15px "PingFang SC", "Microsoft YaHei", sans-serif';
            const tipLines = wrapLines(ctx, tipBody, cw - 44);
            const boxH = 52 + tipLines.length * 24;
            roundRectPath(ctx, cx, y, cw, boxH, 12);
            ctx.fillStyle = '#fff8ef';
            ctx.fill();
            ctx.strokeStyle = '#ffd9a0';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.fillStyle = '#b07830';
            ctx.font = 'bold 16px "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.fillText(tipTitle, cx + 22, y + 32);
            ctx.font = '14px "PingFang SC", "Microsoft YaHei", sans-serif';
            tipLines.forEach(line => { ctx.fillText(line, cx + 22, y + 60); y += 24; });
            y += boxH - 24 + 30;

            // 底部
            ctx.textAlign = 'center';
            ctx.fillStyle = '#b9bcd6';
            ctx.font = '14px "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.fillText(`测于 ${d.date} · 20道题，重新认识你的情感世界`, W / 2, y);

            return y;
        }

/* ===== 导出分享图（与电脑端同款长图：仪表盘 + 雷达 + 刻度带 + 建议） ===== */
function drawShareImage(d) {
  const W = 780, M = 44, SCALE = 1.5;

  const measureCv = document.createElement('canvas');
  measureCv.width = W;
  const mctx = measureCv.getContext('2d');
  const bottomY = drawResultCard(mctx, W, M, d);
  const H = bottomY + M + 20;

  const cv = document.getElementById('shareCanvas');
  cv.width = W * SCALE;
  cv.height = H * SCALE;
  const ctx = cv.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(SCALE, SCALE);

  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#667eea');
  bg.addColorStop(1, '#764ba2');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#ffffff';
  roundRectPath(ctx, M, M, W - M * 2, H - M * 2, 24);
  ctx.fill();

  drawResultCard(ctx, W, M, d);
  return cv.toDataURL('image/png');
}

function exportShare() {
  const d = window.__resultData || calcScores();
  try {
    const url = drawShareImage(d);
    showShareImage(url, d.title);
    toast('分享图已生成');
  } catch (e) {
    toast('生成失败，请直接截图保存');
  }
}

function showShareImage(url, title) {
  let ov = document.getElementById('shareModal');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'shareModal';
    ov.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.85);' +
      'z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;';
    ov.innerHTML = '<div style="background:#fff;border-radius:16px;padding:16px;width:100%;' +
      'max-width:420px;max-height:88%;overflow-y:auto;text-align:center;">' +
      '<img id="shareImg" alt="" style="width:100%;border-radius:12px;display:block;">' +
      '<div style="font-size:13px;color:#6b7280;margin:12px 0;line-height:1.6;">' +
      '长按上方图片即可保存到相册，再发到小红书或朋友圈</div>' +
      '<a id="shareDl" style="display:inline-block;font-size:15px;color:#e85d75;' +
      'border:2px solid #e85d75;border-radius:50px;padding:10px 26px;text-decoration:none;margin-right:10px;">下载图片</a>' +
      '<button id="shareClose" style="font-size:15px;color:#fff;background:#e85d75;' +
      'border:none;border-radius:50px;padding:12px 26px;">关闭</button></div>';
    document.body.appendChild(ov);
    document.getElementById('shareClose').onclick = function () { ov.style.display = 'none'; };
    ov.onclick = function (e) { if (e.target === ov) ov.style.display = 'none'; };
  }
  document.getElementById('shareImg').src = url;
  const a = document.getElementById('shareDl');
  a.href = url;
  a.download = '我的情感画像-' + (title || '') + '.png';
  ov.style.display = 'flex';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 1600);
}

function restart() {
  clearTimeout(advanceTimer);
  answers = [];
  currentQ = 0;
  document.getElementById('progressFill').style.width = '0%';
  showPage('pageCover');
}

</script>
